<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>からだ理解ゲーム — Lesson 1</title>
<style>
  :root{
    --bg:#0e1526; --bg2:#111b31; --card:#182644; --ink:#eaf1ff; --sub:#9fb2d6;
    --line:#28375c; --accent:#5b8cff; --ok:#37c98b; --bad:#ff6b7d; --gold:#ffc34d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow-x:hidden;}
  body{
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
  }
  .app{width:100%;max-width:460px;min-height:100vh;display:flex;flex-direction:column;
    background:radial-gradient(1200px 400px at 50% -10%,#16244a 0,var(--bg) 60%);}
  header{position:sticky;top:0;z-index:5;padding:12px 16px;background:rgba(14,21,38,.9);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .top{display:flex;align-items:center;gap:10px;}
  .lvpill{font-size:12px;background:var(--accent);color:#fff;padding:3px 10px;border-radius:20px;font-weight:700;}
  .xp{margin-left:auto;font-weight:800;color:var(--gold);font-size:14px;}
  .dots{display:flex;gap:6px;margin-top:10px;}
  .dot{flex:1;height:6px;border-radius:6px;background:#22314f;}
  .dot.done{background:var(--ok);} .dot.cur{background:var(--accent);}
  main{flex:1;padding:16px;display:flex;flex-direction:column;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:20px;margin:.2em 0;}
  h2{font-size:18px;margin:.2em 0 .6em;line-height:1.5;}
  p{line-height:1.7;font-size:15px;}
  .sub{color:var(--sub);font-size:13px;}
  .fig{background:#0b1428;border:1px solid var(--line);
    border-radius:14px;padding:10px;margin:14px 0;text-align:center;}
  .fig svg{width:100%;height:auto;max-height:190px;}
  .figcap{font-size:12px;color:var(--sub);margin-top:6px;}
  button{font-family:inherit;}
  .choice{display:block;width:100%;text-align:left;background:#101d38;color:var(--ink);
    border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin:9px 0;font-size:15.5px;
    cursor:pointer;transition:.12s;}
  .choice:active{transform:scale(.99);}
  .choice.correct{border-color:var(--ok);background:rgba(55,201,139,.16);}
  .choice.wrong{border-color:var(--bad);background:rgba(255,107,125,.16);}
  .choice.dim{opacity:.5;}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;
    padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
  .btn.ok{background:var(--ok);}
  .fb{margin-top:14px;}
  .box{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;line-height:1.65;}
  .box.ex{background:#0d2033;border-left:4px solid var(--ok);}
  .box.pt{background:#1e2540;border-left:4px solid var(--gold);}
  .box.rs{background:#2a1f33;border-left:4px solid #d98cff;}
  .center{text-align:center;}
  .badge{font-size:74px;margin:6px;filter:drop-shadow(0 6px 18px rgba(255,195,77,.4));animation:pop .4s;}
  .confetti{font-size:26px;letter-spacing:4px;}
  footer{padding:10px 16px 20px;color:var(--sub);font-size:11px;text-align:center;line-height:1.6;}
  .barwrap{height:10px;background:#22314f;border-radius:10px;overflow:hidden;margin:12px 0;}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <span class="lvpill" id="lvpill">Lv1 身体を知る</span>
      <span class="sub" id="qcount"></span>
      <span class="xp" id="xp">⭐ 0 XP</span>
    </div>
    <div class="dots" id="dots"></div>
  </header>
  <main id="stage"></main>
  <footer>
    教育目的のコンテンツです。感じ方や身体には大きな個人差があります。<br>
    痛みや不安が続くときは医療機関にご相談ください。
  </footer>
</div>

<script>
/* ===== Lesson1（身体を知る）: 5問・図解つき・やさしい言葉 ===== */
const LESSON = {
  level:1, title:"身体を知る", badge:"🗺️", badgeName:"地図マスター",
  intro:"女性の身体の「どこに何があるか」を、図を見ながらやさしく知ろう。\nくわしさより、「知ろうとする気持ち」が大切です。",
  pass:0.6,
  quizzes:[
    {
      q:"外から見える部分ぜんたいを、まとめて何と呼ぶでしょう？",
      choices:["外から見える部分ぜんたいの呼び名（外陰部）","体の中へ続く一本の道の名前","赤ちゃんを育てる部屋の名前","おしっこの出口だけの名前"],
      answer:0, fig:"vulva",
      figcap:"外から見える部分＝外陰部。いくつかの部分が集まっています。",
      explain:"外から見える部分ぜんたいを「外陰部（がいいんぶ）」と呼びます。体の中の道（ちつ）とは別のものです。",
      point:"形や色は人によって大きくちがいます。どれも自然なことです。",
      respect:"名前や場所を知ろうとする姿勢そのものが、相手を大切にすることにつながります。"
    },
    {
      q:"クリトリスは、見えている部分がすべてでしょうか？",
      choices:["見えている部分がすべて","見えるのは一部で、大部分は体の中に広がる","おしっこを出すための部分","赤ちゃんが通る道"],
      answer:1, fig:"iceberg",
      figcap:"氷山のように、見えているのはごく一部。",
      explain:"クリトリスは見えている先の部分は一部で、大部分は体の中に広がっています。",
      point:"感じ方には個人差があり、「ここが正解」という一つの場所はありません。",
      respect:"「こうすれば必ず」ではなく、相手に聞いて合わせる姿勢が大切です。"
    },
    {
      q:"おしっこの出口（尿道）と、体の中へ続く道（ちつ）は、同じ穴でしょうか？",
      choices:["同じ一つの穴","別々の場所にある","つながって一本になっている","季節で変わる"],
      answer:1, fig:"twotubes",
      figcap:"おしっこの道と、体の中への道は別。前後に分かれています。",
      explain:"おしっこの出口（尿道）と、体の中へ続く道（ちつ）は別々です。位置も役割もちがいます。",
      point:"体のつくりは人により少しずつちがいますが、この2つが別なのは共通です。",
      respect:"正しく知っておくと、思い込みで相手を不安にさせずにすみます。"
    },
    {
      q:"外側のひだ・内側のひだ（大陰唇・小陰唇）の形や大きさは？",
      choices:["みんなほぼ同じ","人によって大きくちがい、それが自然","左右が必ず同じ","大人になると全員同じになる"],
      answer:1, fig:"variety",
      figcap:"形・大きさ・左右差はさまざま。多くは自然な個人差。",
      explain:"ひだの形・大きさ・色・左右差には大きな個人差があり、その多くは自然なことです。",
      point:"「普通はこう」という決まった形はありません。ちがいは個性です。",
      respect:"見た目をからかったり比べたりしないこと。ちがいをそのまま受けとめましょう。"
    },
    {
      q:"女性の尿道（おしっこの道）は短めです。そのため何が起きやすい？",
      choices:["視力が下がる","膀胱炎（ぼうこうえん）などが起きやすい","身長が伸びる","味覚が変わる"],
      answer:1, fig:"shorttube",
      figcap:"道が短いぶん、菌が届きやすく膀胱炎が起きやすい。",
      explain:"尿道が短いため、菌がぼうこうに届きやすく、膀胱炎（尿路感染）が起きやすい体のつくりです。",
      point:"起きやすさには体調や生活による個人差もあります。",
      respect:"不調のときは責めず、無理させず、必要なら受診をやさしく後押ししましょう。"
    }
  ]
};

/* ===== 図解SVG ===== */
const FIG = {
  vulva:`<svg viewBox="0 0 300 180"><defs></defs>
    <ellipse cx="150" cy="95" rx="95" ry="72" fill="#20304f" stroke="#3a5088"/>
    <ellipse cx="150" cy="95" rx="52" ry="60" fill="#2a3d63" stroke="#4a68a8"/>
    <ellipse cx="150" cy="60" rx="10" ry="8" fill="#ffc34d"/><text x="168" y="60" fill="#eaf1ff" font-size="11">クリトリス</text>
    <circle cx="150" cy="92" r="4" fill="#8fd0ff"/><text x="168" y="94" fill="#eaf1ff" font-size="11">おしっこの出口</text>
    <ellipse cx="150" cy="120" rx="9" ry="6" fill="#ff9db0"/><text x="168" y="123" fill="#eaf1ff" font-size="11">体の中への入り口</text>
    <text x="20" y="30" fill="#9fb2d6" font-size="11">外側のひだ</text>
    <text x="60" y="150" fill="#9fb2d6" font-size="11">内側のひだ</text>
  </svg>`,
  iceberg:`<svg viewBox="0 0 300 180">
    <rect x="0" y="70" width="300" height="110" fill="#12325a" opacity=".6"/>
    <line x1="0" y1="70" x2="300" y2="70" stroke="#6fb6ff" stroke-dasharray="5 4"/>
    <text x="8" y="64" fill="#9fb2d6" font-size="11">見える部分</text>
    <text x="8" y="86" fill="#9fb2d6" font-size="11">体の中</text>
    <polygon points="150,40 130,70 170,70" fill="#ffc34d"/>
    <polygon points="150,70 95,175 205,175" fill="#f0b429" opacity=".85"/>
    <text x="120" y="130" fill="#0e1526" font-size="12" font-weight="700">大部分は</text>
    <text x="120" y="148" fill="#0e1526" font-size="12" font-weight="700">体の中</text>
  </svg>`,
  twotubes:`<svg viewBox="0 0 300 180">
    <rect x="55" y="40" width="30" height="100" rx="14" fill="#8fd0ff"/>
    <text x="30" y="158" fill="#9fb2d6" font-size="11">おしっこの道</text>
    <rect x="150" y="40" width="46" height="110" rx="20" fill="#ff9db0"/>
    <text x="140" y="168" fill="#9fb2d6" font-size="11">体の中への道</text>
    <text x="120" y="30" fill="#eaf1ff" font-size="12">別々です</text>
    <text x="95" y="95" fill="#0e1526" font-size="22">≠</text>
  </svg>`,
  variety:`<svg viewBox="0 0 300 180">
    <g fill="#2a3d63" stroke="#4a68a8">
      <ellipse cx="60" cy="90" rx="34" ry="52"/>
      <ellipse cx="150" cy="90" rx="42" ry="40"/>
      <ellipse cx="240" cy="90" rx="28" ry="58"/>
    </g>
    <g fill="#ff9db0"><ellipse cx="60" cy="90" rx="12" ry="34"/>
      <ellipse cx="150" cy="90" rx="20" ry="22"/><ellipse cx="240" cy="90" rx="9" ry="40"/></g>
    <text x="70" y="168" fill="#9fb2d6" font-size="12">形も大きさも人それぞれ＝自然</text>
  </svg>`,
  shorttube:`<svg viewBox="0 0 300 180">
    <circle cx="90" cy="95" r="40" fill="#2a3d63" stroke="#4a68a8"/>
    <text x="66" y="99" fill="#eaf1ff" font-size="12">ぼうこう</text>
    <rect x="130" y="82" width="70" height="26" rx="13" fill="#8fd0ff"/>
    <text x="140" y="72" fill="#9fb2d6" font-size="11">短い道</text>
    <text x="210" y="100" fill="#ff6b7d" font-size="22">菌→</text>
    <text x="40" y="160" fill="#9fb2d6" font-size="12">道が短い→膀胱炎が起きやすい</text>
  </svg>`
};

let idx=0, correct=0, xp=0, phase="intro";
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderDots(){
  const n=LESSON.quizzes.length;
  let h="";
  for(let i=0;i<n;i++){h+=`<div class="dot ${i<idx?'done':(i===idx&&phase==='quiz'?'cur':'')}"></div>`;}
  $('dots').innerHTML=h;
  $('xp').textContent=`⭐ ${xp} XP`;
  $('qcount').textContent = phase==='quiz'?`問題 ${idx+1}/${n}`:'';
}

function intro(){
  phase="intro"; renderDots();
  $('stage').innerHTML=`<div class="card center">
    <div class="badge">${LESSON.badge}</div>
    <h1>Lesson 1</h1><h2>${LESSON.title}</h2>
    <p class="sub" style="white-space:pre-line">${esc(LESSON.intro)}</p>
    <div class="barwrap"><div class="bar" style="width:0"></div></div>
    <p class="sub">全${LESSON.quizzes.length}問・図を見ながら1問ずつ</p>
    <button class="btn" id="go">スタート ▶</button>
  </div>`;
  $('go').onclick=()=>{idx=0;correct=0;question();};
}

function question(){
  phase="quiz"; renderDots();
  const q=LESSON.quizzes[idx];
  $('stage').innerHTML=`<div class="card">
    <h2>${esc(q.q)}</h2>
    <div class="fig">${FIG[q.fig]||''}<div class="figcap">🖼 ${esc(q.figcap)}</div></div>
    <div id="choices"></div>
    <div class="fb" id="fb"></div>
  </div>`;
  const box=$('choices');
  q.choices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.innerHTML=esc(c);
    b.onclick=()=>pick(i,b); box.appendChild(b);
  });
  const bar=idx/LESSON.quizzes.length*100;
}

function pick(i,btn){
  const q=LESSON.quizzes[idx];
  const right=i===q.answer;
  [...document.querySelectorAll('#choices .choice')].forEach((b,j)=>{
    b.onclick=null;
    if(j===q.answer) b.classList.add('correct');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(right){correct++; xp+=10;}
  renderDots();
  $('fb').innerHTML=`
    <div class="box ex">${right?'⭕ 正解！':'✏️ こう考えよう'}　${esc(q.explain)}</div>
    <div class="box pt">💡 ワンポイント：${esc(q.point)}</div>
    <div class="box rs">🤝 大切なこと：${esc(q.respect)}</div>
    <button class="btn" id="next">${idx<LESSON.quizzes.length-1?'つぎへ ▶':'結果を見る 🎉'}</button>`;
  $('next').onclick=()=>{idx++; idx<LESSON.quizzes.length?question():clear();};
}

function levelup(){
  phase="levelup"; renderDots();
  $('stage').innerHTML=`<div class="card center">
    <div class="confetti">✨🎉✨</div>
    <div class="badge">${LESSON.badge}</div>
    <h1>レベルクリア！</h1>
    <p>バッジ獲得： <b style="color:var(--gold)">${LESSON.badge} ${esc(LESSON.badgeName)}</b></p>
    <button class="btn ok" id="next2">つづける ▶</button>
  </div>`;
  $('next2').onclick=clearScreen;
}

function clear(){ // 合否判定→クリア画面
  const ratio=correct/LESSON.quizzes.length;
  const pass=ratio>=LESSON.pass;
  phase="clear"; renderDots();
  $('stage').innerHTML=`<div class="card center">
    <div class="confetti">${pass?'✨🎉✨':'🔁'}</div>
    <div class="badge">${pass?LESSON.badge:'📗'}</div>
    <h1>${pass?'Lesson 1 クリア！':'もう一歩！'}</h1>
    <p>${correct} / ${LESSON.quizzes.length} 問せいかい</p>
    <div class="barwrap"><div class="bar" id="rbar"></div></div>
    <p class="xp" style="font-size:20px">⭐ ${xp} XP 獲得</p>
    ${pass?`<p>バッジ： <b style="color:var(--gold)">${LESSON.badge} ${esc(LESSON.badgeName)}</b> を手に入れた！</p>
      <p class="sub">あなたは「身体を知る」を達成しました。<br>次は Lv2「仕組みを知る」（近日公開）。</p>`:
      `<p class="sub">${Math.round(LESSON.pass*100)}%以上でクリアです。もう一度ためしてみよう。</p>`}
    <button class="btn ${pass?'ok':''}" id="again">もう一度あそぶ 🔄</button>
  </div>`;
  setTimeout(()=>{const b=$('rbar'); if(b)b.style.width=Math.round(ratio*100)+'%';},60);
  $('again').onclick=()=>{xp=0;idx=0;correct=0;intro();};
}
function clearScreen(){clear();}

// スクリーンショット用の直接遷移（?shot=intro|feedback|clear）。通常利用には影響しない。
const _shot=new URLSearchParams(location.search).get('shot');
if(_shot==='feedback'){
  idx=0;correct=0;question();
  setTimeout(()=>{const c=document.querySelectorAll('#choices .choice');
    if(c[LESSON.quizzes[0].answer]) c[LESSON.quizzes[0].answer].click();},80);
}else if(_shot==='clear'){
  xp=50;correct=5;idx=LESSON.quizzes.length;clear();
}else{
  intro();
}
</script>
</body>
</html>
